        <!-- Run this page's JavaScript interactions. -->
        <script>
            // Start page-specific JavaScript without adding global variables.
            (() => {
                // Enable strict JavaScript checks.
                'use strict';
                // Read the currently signed-in user.
                const activeUser = user();
                // Build the user's displayed full name.
                const fullName = activeUser
                    // Continue the expression from the preceding line.
                    ? ([activeUser.firstName, activeUser.lastName].filter(Boolean).join(' ') || activeUser.name || '')
                    // Continue the expression from the preceding line.
                    : '';
                // Declare a value used by this page.
                const namePlace = document.getElementById('signedInName');
                // Check a condition before continuing.
                if (namePlace && fullName) {
                    // Update content shown on the page.
                    namePlace.textContent = fullName;
                    // Show or hide part of the interface.
                    namePlace.classList.remove('hidden');
                // Finish this code block or expression.
                }
                // Declare a value used by this page.
                const welcome = document.getElementById('welcome');
                // Check a condition before continuing.
                if (welcome && fullName) {
                    // Update content shown on the page.
                    welcome.textContent = 'Welcome, ' + fullName + '.';
                // Finish this code block or expression.
                }
            // Finish this code block or expression.
            })();
        </script> <!-- End the script block. -->
        <!-- Run this page's JavaScript interactions. -->
        <script>
            // Start page-specific JavaScript without adding global variables.
            (() => {
                // Enable strict JavaScript checks.
                'use strict';
                // This file owns only its own step. The shared external JS and CSS are unchanged.
                // Read the currently signed-in user.
                const student = user();
                // Check a condition before continuing.
                if (!student || student.role !== 'student') {
                    // Navigate to the next appropriate page.
                    window.location.replace('login.html?role=student');
                    // Return from the current function.
                    return;
                // Finish this code block or expression.
                }
                // Create the local draft key for this student.
                const draftKey = 'creditbridge_application_draft_' + student.id;
                // Prepare the application draft data.
                let draft = {};
                // Handle stored data safely.
                try {
                    // Read previously saved application information.
                    const saved = JSON.parse(localStorage.getItem(draftKey) || '{}');
                    // Check a condition before continuing.
                    if (saved && typeof saved === 'object' && !Array.isArray(saved)) draft = saved;
                // Finish this code block or expression.
                } catch (error) { draft = {}; }
                // Create a shortcut to find page elements.
                const byId = id => document.getElementById(id);
                // Define how to save progress between pages.
                const saveDraft = () => localStorage.setItem(draftKey, JSON.stringify(draft));
                // Define how to show a validation message.
                const showError = (id, message) => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = message;
                    // Show or hide part of the interface.
                    element.classList.remove('hidden');
                // Finish this code block or expression.
                };
                // Define how to hide a validation message.
                const clearError = id => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = '';
                    // Show or hide part of the interface.
                    element.classList.add('hidden');
                // Finish this code block or expression.
                };
                // PAGE LOGIC START
                // Step 1: Previous university.
                // Declare a value used by this page.
                const university = byId('universityName');
                // Read or update a form selection.
                university.value = draft.university || localStorage.getItem('creditbridge_university_draft_' + student.id) || '';
                // Run this handler when the user interacts.
                byId('universityStepForm').addEventListener('submit', event => {
                    // Run the next part of this page's behaviour.
                    event.preventDefault();
                    // Read or update a form selection.
                    draft.university = university.value.trim();
                    // Check a condition before continuing.
                    if (!draft.university) { university.reportValidity(); return; }
                    // Run the next part of this page's behaviour.
                    saveDraft();
                    // Navigate to the next appropriate page.
                    location.href = 'program.html';
                // Finish this code block or expression.
                });
                // PAGE LOGIC END
            // Finish this code block or expression.
            })();
        </script> <!-- End the script block. -->
