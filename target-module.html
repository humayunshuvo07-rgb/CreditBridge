        <!-- Run this page's JavaScript interactions. -->
        <script>
            // Start page-specific JavaScript without adding global variables.
            (() => {
                // Enable strict JavaScript checks.
                'use strict';
                // This file owns only its own step. The shared external JS and CSS are unchanged.
                // Read the currently signed-in user.
                const student = user();
                // Check a condition before continuing.
                if (!student || student.role !== 'student') {
                    // Navigate to the next appropriate page.
                    window.location.replace('login.html?role=student');
                    // Return from the current function.
                    return;
                // Finish this code block or expression.
                }
                // Create the local draft key for this student.
                const draftKey = 'creditbridge_application_draft_' + student.id;
                // Prepare the application draft data.
                let draft = {};
                // Handle stored data safely.
                try {
                    // Read previously saved application information.
                    const saved = JSON.parse(localStorage.getItem(draftKey) || '{}');
                    // Check a condition before continuing.
                    if (saved && typeof saved === 'object' && !Array.isArray(saved)) draft = saved;
                // Finish this code block or expression.
                } catch (error) { draft = {}; }
                // Create a shortcut to find page elements.
                const byId = id => document.getElementById(id);
                // Define how to save progress between pages.
                const saveDraft = () => localStorage.setItem(draftKey, JSON.stringify(draft));
                // Define how to show a validation message.
                const showError = (id, message) => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = message;
                    // Show or hide part of the interface.
                    element.classList.remove('hidden');
                // Finish this code block or expression.
                };
                // Define how to hide a validation message.
                const clearError = id => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = '';
                    // Show or hide part of the interface.
                    element.classList.add('hidden');
                // Finish this code block or expression.
                };
                // PAGE LOGIC START
                // Step 6: Populate only the chosen programme's module catalogue.
                // Read module entries from the programme guide data.
                const catalogues = JSON.parse(byId('catalogueData').textContent);
                // Get modules belonging to the selected programme.
                const records = catalogues[draft.program] || [];
                // Check a condition before continuing.
                if (!records.length) { location.replace('program.html'); return; }
                // Declare a value used by this page.
                const select = byId('targetModuleName');
                // Process the available items one by one.
                for (const item of records) {
                    // Declare a value used by this page.
                    const option = document.createElement('option');
                    // Read or update a form selection.
                    option.value = item.id;
                    // Update content shown on the page.
                    option.textContent = item.code + ': ' + item.name;
                    // Run the next part of this page's behaviour.
                    select.appendChild(option);
                // Finish this code block or expression.
                }
                // Read or update a form selection.
                select.value = records.some(item => item.id === draft.targetModuleId) ? draft.targetModuleId : '';
                // Declare a value used by this page.
                const typeChoices = [...document.querySelectorAll('input[name="moduleType"]')];
                // Read or update a form selection.
                typeChoices.forEach(input => { input.checked = input.value === draft.moduleType; });
                const autoSelectCategory = () => {
                    const selected = records.find(item => item.id === select.value);
                    if (selected) {
                        typeChoices.forEach(input => {
                            input.checked = input.value === selected.type;
                            input.removeAttribute('aria-invalid');
                        });
                        document.getElementById('targetModuleForm-moduleType-error')?.remove();
                        clearError('targetModuleMessage');
                    }
                };
                typeChoices.forEach(input => input.addEventListener('change', () => {
                    if (input.checked) {
                        document.getElementById('targetModuleForm-moduleType-error')?.remove();
                        typeChoices.forEach(choice => choice.removeAttribute('aria-invalid'));
                    }
                }));
                // Declare a value used by this page.
                const detail = byId('targetModuleInfo');
                // Declare a value used by this page.
                const renderModule = () => {
                    // Declare a value used by this page.
                    const selected = records.find(item => item.id === select.value);
                    // Update content shown on the page.
                    detail.textContent = selected
                        // Continue the expression from the preceding line.
                        ? [selected.ects && selected.ects + ' ECTS', selected.sws && selected.sws + ' SWS'].filter(Boolean).join(' · ')
                        // Continue the expression from the preceding line.
                        : '';
                // Finish this code block or expression.
                };
                // Run this handler when the user interacts.
                select.addEventListener('change', () => {
                    // Declare a value used by this page.
                    const selected = records.find(item => item.id === select.value);
                    // Check a condition before continuing.
                    if (selected) {
                        // Set the suggested module category and remove an outdated error.
                        autoSelectCategory();
                    // Finish this code block or expression.
                    }
                    // Run the next part of this page's behaviour.
                    renderModule();
                // Finish this code block or expression.
                });
                // Let students change the selected THD module without losing other draft fields.
                byId('editTargetModule')?.addEventListener('click', () => {
                    select.value = '';
                    const search = byId('targetModuleSearch');
                    if (search) {
                        search.value = '';
                        search.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                    typeChoices.forEach(input => { input.checked = false; });
                    draft.targetModule = '';
                    draft.targetModuleId = '';
                    draft.targetModuleEcts = '';
                    draft.moduleType = '';
                    saveDraft();
                    renderModule();
                    select.focus();
                });
                // Run the next part of this page's behaviour.
                renderModule();
                // Restore the suggested category when returning to this page.
                if (select.value && !typeChoices.some(input => input.checked)) autoSelectCategory();
                // Run this handler when the user interacts.
                byId('targetModuleForm').addEventListener('submit', event => {
                    // Run the next part of this page's behaviour.
                    event.preventDefault();
                    // Declare a value used by this page.
                    const selected = records.find(item => item.id === select.value);
                    // Declare a value used by this page.
                    const type = document.querySelector('input[name="moduleType"]:checked');
                    // Check a condition before continuing.
                    if (!selected || !type) {
                        // Run the next part of this page's behaviour.
                        showError('targetModuleMessage', 'Choose a THD module. Its module category will be selected automatically.');
                        // Return from the current function.
                        return;
                    // Finish this code block or expression.
                    }
                    // Run the next part of this page's behaviour.
                    draft.targetModuleId = selected.id;
                    // Run the next part of this page's behaviour.
                    draft.targetModule = selected.code + ': ' + selected.name;
                    // Run the next part of this page's behaviour.
                    draft.targetModuleEcts = selected.ects || '';
                    // Read or update a form selection.
                    draft.moduleType = type.value;
                    // Run the next part of this page's behaviour.
                    saveDraft();
                    // Navigate to the next appropriate page.
                    location.href = 'review.html';
                // Finish this code block or expression.
                });
                // PAGE LOGIC END
            // Finish this code block or expression.
            })();
        </script> <!-- End the script block. -->
