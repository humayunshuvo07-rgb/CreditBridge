<!DOCTYPE html>
<!-- Defines the HTML document type. -->
<!-- Main HTML document -->
<html lang="en">
    <!-- Page metadata and resource links -->
    <head>
        <!-- Browser metadata / responsive configuration -->
        <meta charset="utf-8">
        <!-- Browser metadata / responsive configuration -->
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <!-- Browser tab title -->
        <title>
            Login | CreditBridge
        </title>
        <!-- External stylesheet or linked resource -->
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <!-- Visible page content -->
    <body>
        <!-- Site header -->
        <header>
            <!-- Page navigation -->
            <nav class="nav">
                <!-- Link to index.html -->
                <a class="brand" href="index.html">
                    CREDIT
                    <!-- Bold brand emphasis -->
                    <b>
                        BRIDGE.
                    </b>
                </a>
                <!-- Layout or content wrapper: links -->
                <div class="links">
                    <!-- Link to index.html -->
                    <a href="index.html">
                        Home
                    </a>
                    <!-- Link to how-it-works.html -->
                    <a href="how-it-works.html">
                        How it works
                    </a>
                    <!-- Link to apply.html -->
                    <a href="apply.html">
                        New application
                    </a>
                    <!-- Link to login.html -->
                    <a href="login.html" id="loginNav">
                        Login
                    </a>
                    <!-- Link to register.html -->
                    <a href="register.html" id="registerNav">
                        Register
                    </a>
                    <!-- Link to # -->
                    <a href="#" id="logoutNav" class="hidden">
                        Logout
                    </a>
                </div>
            </nav>
        </header>
        <!-- Primary page content -->
        <main>
        <!-- Easy return link to the main CreditBridge homepage -->
        <div class="home-return">
            <a href="index.html" aria-label="Back to CreditBridge home page">← Back to Home</a>
        </div>

            <!-- Page content section: wrap -->
            <section class="wrap">
                <!-- Layout or content wrapper: panel form -->
                <div class="panel form">
                    <!-- Layout or content wrapper: eyebrow -->
                    <div class="eyebrow">
                        WELCOME BACK
                    </div>
                    <!-- Section heading -->
                    <h2>
                        Sign in
                    </h2>
                    <!-- Layout or content wrapper: field -->
                    <div class="field">
                        <!-- Label for a form field -->
                        <label>
                            Sign in as
                        </label>
                        <!-- Layout or content wrapper: login-role-switch -->
                        <div class="login-role-switch" role="group" aria-label="Account type">
                            <!-- Clickable button -->
                            <button type="button" class="login-role active" data-role="student" aria-pressed="true">
                                Student
                            </button>
                            <!-- Clickable button -->
                            <button type="button" class="login-role" data-role="employee" aria-pressed="false">
                                Employee
                            </button>
                        </div>
                        <!-- Text paragraph -->
                        <p id="staffHint" class="muted small hidden">
                            Employee access requires an existing Lecturer or Study Center account.
                        </p>
                    </div>
                    <!-- Layout or content wrapper -->
                    <div id="message">
                    </div>
                    <!-- Input form -->
                    <form id="loginForm">
                        <!-- role input field -->
                        <input type="hidden" name="role" id="loginRole" value="student">
                        <!-- Layout or content wrapper: field -->
                        <div class="field">
                            <!-- Label for a form field -->
                            <label>
                                Email
                            </label>
                            <!-- email input field -->
                            <input name="email" type="email" required>
                        </div>
                        <!-- Layout or content wrapper: field -->
                        <div class="field">
                            <!-- Label for a form field -->
                            <label>
                                Password
                            </label>
                            <!-- password input field -->
                            <input name="password" type="password" required>
                        </div>
                        <!-- Clickable button -->
                        <button class="btn" type="submit">
                            Login →
                        </button>
                    </form>
                    <!-- Text paragraph -->
                    <p>
                        <!-- Inline text or styled label -->
                        <span id="registerPrompt">
                            New student?
                        </span>
                        <!-- Link to register.html -->
                        <a href="register.html" style="color:#ff5a63">
                            Register
                        </a>
                    </p>
                </div>
            </section>
        </main>
        <!-- Load JavaScript file js/app.js -->
        <script src="js/app.js">
        </script>
    </body>
</html>
