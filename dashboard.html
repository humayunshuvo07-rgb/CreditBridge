<!DOCTYPE html>
<!-- Defines the HTML document type. -->
<!-- Main HTML document -->
<html lang="en">
    <!-- Page metadata and resource links -->
    <head>
        <!-- Browser metadata / responsive configuration -->
        <meta charset="utf-8">
        <!-- Browser metadata / responsive configuration -->
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <!-- Browser tab title -->
        <title>
            Dashboard | CreditBridge
        </title>
        <!-- External stylesheet or linked resource -->
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <!-- Visible page content -->
    <body>
        <!-- Site header -->
        <header>
            <!-- Page navigation -->
            <nav class="nav">
                <!-- Link to index.html -->
                <a class="brand" href="index.html">
                    CREDIT
                    <!-- Bold brand emphasis -->
                    <b>
                        BRIDGE.
                    </b>
                </a>
                <!-- Layout or content wrapper: links -->
                <div class="links">
                    <!-- Link to index.html -->
                    <a href="index.html">
                        Home
                    </a>
                    <!-- Link to how-it-works.html -->
                    <a href="how-it-works.html">
                        How it works
                    </a>
                    <!-- Link to apply.html -->
                    <a href="apply.html">
                        New application
                    </a>
                    <!-- Link to login.html -->
                    <a href="login.html" id="loginNav">
                        Login
                    </a>
                    <!-- Link to register.html -->
                    <a href="register.html" id="registerNav">
                        Register
                    </a>
                    <!-- Link to # -->
                    <a href="#" id="logoutNav" class="hidden">
                        Logout
                    </a>
                </div>
            </nav>
        </header>
        <!-- Primary page content -->
        <main>
        <!-- Easy return link to the main CreditBridge homepage -->
        <div class="home-return">
            <a href="index.html" aria-label="Back to CreditBridge home page">← Back to Home</a>
        </div>

            <!-- Page content section: wrap -->
            <section class="wrap">
                <!-- Layout or content wrapper: eyebrow -->
                <div class="eyebrow">
                    MY CREDITBRIDGE
                </div>
                <!-- Main page heading -->
                <h1 id="welcome">
                    Dashboard
                </h1>
                <!-- Text paragraph -->
                <p id="roleText" class="muted">
                </p>
                <!-- Layout or content wrapper: grid -->
                <div class="grid" id="stats">
                </div>
                <!-- Page content section: section -->
                <section class="section">
                    <!-- Layout or content wrapper -->
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
                        <!-- Section heading -->
                        <h2 id="dashboardHeading">
                            My applications
                        </h2>
                        <!-- Link to apply.html -->
                        <a class="btn" id="newButton" href="apply.html">
                            + New application
                        </a>
                    </div>
                    <!-- Layout or content wrapper: panel table-wrap -->
                    <div class="panel table-wrap">
                        <!-- Data table -->
                        <table>
                            <!-- Table column headings -->
                            <thead>
                                <!-- Table row -->
                                <tr>
                                    <!-- Table heading cell -->
                                    <th>
                                        ID
                                    </th>
                                    <!-- Table heading cell -->
                                    <th>
                                        Original course
                                    </th>
                                    <!-- Table heading cell -->
                                    <th>
                                        Target course
                                    </th>
                                    <!-- Table heading cell -->
                                    <th>
                                        Status
                                    </th>
                                    <!-- Table heading cell -->
                                    <th>
                                        Action
                                    </th>
                                </tr>
                            </thead>
                            <!-- Table body -->
                            <tbody id="applicationsBody">
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
        <!-- Load JavaScript file js/app.js -->
        <script src="js/app.js">
        </script>
    </body>
</html>
