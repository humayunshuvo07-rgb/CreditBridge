        <!-- Run this page's JavaScript interactions. -->

            // Start page-specific JavaScript without adding global variables.
            (() => {
                // Enable strict JavaScript checks.
                'use strict';
                // Read the currently signed-in user.
                const activeUser = user();
                // Build the user's displayed full name.
                const fullName = activeUser
                    // Continue the expression from the preceding line.
                    ? ([activeUser.firstName, activeUser.lastName].filter(Boolean).join(' ') || activeUser.name || '')
                    // Continue the expression from the preceding line.
                    : '';
                // Declare a value used by this page.
                const namePlace = document.getElementById('signedInName');
                // Check a condition before continuing.
                if (namePlace && fullName) {
                    // Update content shown on the page.
                    namePlace.textContent = fullName;
                    // Show or hide part of the interface.
                    namePlace.classList.remove('hidden');
                // Finish this code block or expression.
                }
                // Declare a value used by this page.
                const welcome = document.getElementById('welcome');

                if (welcome && fullName) {
                    // Update content shown on the page.
                    welcome.textContent = 'Welcome, ' + fullName + '.';
                // Finish this code block or expression.
                }
            // Finish this code block or expression.

        </script> <!-- End the script block. -->
        <!-- Run this page's JavaScript interactions. -->
        <script>
            // Start page-specific JavaScript without adding global variables.
            (() => {
                // Enable strict JavaScript checks.
                'use strict';
                // This file owns only its own step. The shared external JS and CSS are unchanged.
                // Read the currently signed-in user.
                const student = user();
                // Check a condition before continuing.
                if (!student || student.role !== 'student') {
                    // Navigate to the next appropriate page.
                    window.location.replace('login.html?role=student');
                    // Return from the current function.
                    return;
                // Finish this code block or expression.
                }
                // Create the local draft key for this student.
                const draftKey = 'creditbridge_application_draft_' + student.id;
                // Prepare the application draft data.
                let draft = {};
                // Handle stored data safely.
                try {
                    // Read previously saved application information.
                    const saved = JSON.parse(localStorage.getItem(draftKey) || '{}');
                    // Check a condition before continuing.
                    if (saved && typeof saved === 'object' && !Array.isArray(saved)) draft = saved;
                // Finish this code block or expression.
                } catch (error) { draft = {}; }
                // Create a shortcut to find page elements.
                const byId = id => document.getElementById(id);
                // Define how to save progress between pages.
                const saveDraft = () => localStorage.setItem(draftKey, JSON.stringify(draft));
                // Define how to show a validation message.
                const showError = (id, message) => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = message;
                    // Show or hide part of the interface.
                    element.classList.remove('hidden');
                // Finish this code block or expression.
                };
                // Define how to hide a validation message.
                const clearError = id => {
                    // Declare a value used by this page.
                    const element = byId(id);
                    // Update content shown on the page.
                    element.textContent = '';
                    // Show or hide part of the interface.
                    element.classList.add('hidden');
                // Finish this code block or expression.
                };
                // PAGE LOGIC START
                // Step 8: Validate the date and signature before submitting.
                // Declare a value used by this page.
                const date = byId('studentSignatureDate');
                // Declare a value used by this page.
                const file = byId('studentSignatureFile');
                // Declare a value used by this page.
                const preview = byId('signatureFilePreview');
                // Declare a value used by this page.
                const clear = byId('clearSignatureFile');
                // Read or update a form selection.
                date.value = draft.studentSignatureDate || '';
                // Declare a value used by this page.
                const isValidFile = chosen => {
                    // Check a condition before continuing.
                    if (!chosen || !/\.(jpe?g|png|pdf)$/i.test(chosen.name)) return false;
                    // Return from the current function.
                    return !chosen.type || ['image/jpeg','image/png','application/pdf'].includes(chosen.type);
                // Finish this code block or expression.
                };
                // Declare a value used by this page.
                const displayFile = () => {
                    // Declare a value used by this page.
                    const chosen = file.files[0];
                    // Update content shown on the page.
                    preview.textContent = chosen ? chosen.name : 'No file selected';
                    // Run the next part of this page's behaviour.
                    clear.hidden = !chosen;
                    // Run the next part of this page's behaviour.
                    file.setCustomValidity('');
                    // Run the next part of this page's behaviour.
                    clearError('signatureMessage');
                // Finish this code block or expression.
                };
                // Run this handler when the user interacts.
                file.addEventListener('change', displayFile);
                // Run this handler when the user interacts.
                clear.addEventListener('click', () => { file.value = ''; displayFile(); });
                // Run the next part of this page's behaviour.
                displayFile();
                // Run this handler when the user interacts.
                byId('signatureForm').addEventListener('submit', event => {
                    // Run the next part of this page's behaviour.
                    event.preventDefault();
                    // Check a condition before continuing.
                    if (!date.value) { date.reportValidity(); return; }
                    // Declare a value used by this page.
                    const chosen = file.files[0];
                    // Check a condition before continuing.
                    if (!isValidFile(chosen)) {
                        // Run the next part of this page's behaviour.
                        file.setCustomValidity('Choose a JPG, PNG or PDF file.');
                        // Run the next part of this page's behaviour.
                        showError('signatureMessage', 'Choose a JPG, PNG or PDF file.');
                        // Run the next part of this page's behaviour.
                        file.reportValidity();
                        // Return from the current function.
                        return;
                    // Finish this code block or expression.
                    }
                    // Check a condition before continuing.
                    if (!draft.university || !draft.program || !draft.targetModule || !draft.ects ||
                        // Continue the expression from the preceding line.
                        (!draft.moduleGerman && !draft.moduleEnglish)) {
                        // Navigate to the next appropriate page.
                        location.href = 'apply.html';
                        // Return from the current function.
                        return;
                    // Finish this code block or expression.
                    }
                    // Keep the application in CreditBridge's existing browser-based demo database.
                    // Declare a value used by this page.
                    const db = getDB();
                    // Declare a value used by this page.
                    const id = db.nextApplication++;
                    // Build the user's displayed full name.
                    const fullName = [student.firstName, student.lastName].filter(Boolean).join(' ') || student.name || '';
                    // Declare a value used by this page.
                    const application = {
                        // Run the next part of this page's behaviour.
                        id: id,
                        // Run the next part of this page's behaviour.
                        studentId: student.id,
                        // Run the next part of this page's behaviour.
                        fullName: fullName,
                        // Run the next part of this page's behaviour.
                        matriculationNumber: student.number || '',
                        // Run the next part of this page's behaviour.
                        studentEmail: student.email,
                        // Run the next part of this page's behaviour.
                        institution: draft.university,
                        // Run the next part of this page's behaviour.
                        program: draft.program,
                        // Run the next part of this page's behaviour.
                        originalCourse: draft.moduleEnglish || draft.moduleGerman,
                        // Run the next part of this page's behaviour.
                        originalCourseGerman: draft.moduleGerman || '',
                        // Run the next part of this page's behaviour.
                        originalCourseEnglish: draft.moduleEnglish || '',
                        // Run the next part of this page's behaviour.
                        originalCredits: draft.ects,
                        // Run the next part of this page's behaviour.
                        sws: draft.sws || '',
                        // Run the next part of this page's behaviour.
                        targetCourse: draft.targetModule,
                        // Run the next part of this page's behaviour.
                        targetCredits: draft.targetModuleEcts || '',
                        // Run the next part of this page's behaviour.
                        moduleType: draft.moduleType || '',
                        // Run the next part of this page's behaviour.
                        documentTypes: draft.documentTypes || [],
                        // Run the next part of this page's behaviour.
                        documentFileNames: draft.documentFileNames || {},
                        // Run the next part of this page's behaviour.
                        description: draft.moduleContact || draft.otherDocuments || '',
                        // Read or update a form selection.
                        signatureDate: date.value,
                        // Run the next part of this page's behaviour.
                        signatureFileName: chosen.name,
                        // Each listed lecturer receives a separate review notification in their dashboard.
                        assignedLecturers: reviewersForApplication({program: draft.program, targetCourse: draft.targetModule}),
                        lecturerReviews: [],
                        // Distinct review requests are recorded for each assigned lecturer.
                        reviewNotifications: reviewersForApplication({program: draft.program, targetCourse: draft.targetModule}).map(name => ({
                            reviewer: name,
                            message: 'New credit-recognition request for ' + draft.targetModule,
                            createdAt: new Date().toISOString(),
                            acknowledged: false
                        })),
                        // Run the next part of this page's behaviour.
                        status: 'Pending review',
                        // Run the next part of this page's behaviour.
                        createdAt: new Date().toLocaleString(),
                        // Run the next part of this page's behaviour.
                        decisions: []
                    // Finish this code block or expression.
                    };
                    // Run the next part of this page's behaviour.
                    db.applications.unshift(application);
                    // Run the next part of this page's behaviour.
                    setDB(db);
                    // Access the browser's existing local demo data.
                    localStorage.removeItem(draftKey);
                    // Navigate to the next appropriate page.
                    location.href = 'submitted.html?id=' + encodeURIComponent(id);
                // Finish this code block or expression.
                });
                // PAGE LOGIC END
            // Finish this code block or expression.
            })();
        </script> <!-- End the script block. -->
